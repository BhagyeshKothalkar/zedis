name: Zedis CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: zedisv1
  REGION: asia-south1
  REPOSITORY: zedis
  IMAGE_NAME: zedis
  VM_NAME: zedis-vm
  VM_ZONE: asia-south1-b
  CI_SERVICE_ACCOUNT: zedis-ci@zedisv1.iam.gserviceaccount.com
  WIF_PROVIDER: projects/373840764878/locations/global/workloadIdentityPools/github/providers/github

jobs:
  build:
    name: Build, publish and deploy Zedis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            curl \
            jq

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Show binary
        run: |
          ls -lh build/zedis
          file build/zedis

      - name: Build Docker image
        run: |
          docker build \
            --tag "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s

      - name: Configure Docker
        if: github.event_name == 'push'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Generate ephemeral SSH key
        if: github.event_name == 'push'
        run: |
          ssh-keygen \
            -t rsa \
            -b 3072 \
            -N "" \
            -f /tmp/zedis-deploy-key

      - name: Add ephemeral key to CI service account OS Login
        if: github.event_name == 'push'
        id: oslogin
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          PUBLIC_KEY="$(cat /tmp/zedis-deploy-key.pub)"
          EXPIRATION="$(($(date +%s) + 600))000000"

          jq -n \
            --arg key "$PUBLIC_KEY" \
            --arg expiration "$EXPIRATION" \
            '{
              key: $key,
              expirationTimeUsec: $expiration
            }' \
            > /tmp/oslogin-request.json

          RESPONSE="$(
            curl --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Content-Type: application/json" \
              "https://oslogin.googleapis.com/v1/users/${CI_SERVICE_ACCOUNT}:importSshPublicKey?projectId=${PROJECT_ID}" \
              --data @/tmp/oslogin-request.json
          )"

          echo "$RESPONSE" | jq .

          OSLOGIN_USERNAME="$(
            echo "$RESPONSE" |
              jq -r '.loginProfile.posixAccounts[0].username // empty'
          )"

          test -n "$OSLOGIN_USERNAME"

          echo "OS Login username: $OSLOGIN_USERNAME"
          echo "username=$OSLOGIN_USERNAME" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: github.event_name == 'push'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          VM_NAME: ${{ env.VM_NAME }}
          VM_ZONE: ${{ env.VM_ZONE }}
          OSLOGIN_USERNAME: ${{ steps.oslogin.outputs.username }}
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud compute ssh \
            "${OSLOGIN_USERNAME}@${VM_NAME}" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --ssh-key-file=/tmp/zedis-deploy-key \
            --quiet \
            --command="sudo /usr/local/bin/deploy-zedis $IMAGE_URI"
