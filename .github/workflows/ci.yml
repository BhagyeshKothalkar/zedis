name: Zedis CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: zedisv1
  REGION: asia-south1
  REPOSITORY: zedis
  IMAGE_NAME: zedis
  VM_NAME: zedis-vm
  VM_ZONE: asia-south1-b
  CI_SERVICE_ACCOUNT: zedis-ci@zedisv1.iam.gserviceaccount.com
  WIF_PROVIDER: projects/373840764878/locations/global/workloadIdentityPools/github/providers/github

jobs:
  build:
    name: Build, publish and deploy Zedis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            curl \
            jq \
            valgrind \
            redis-tools

      - name: Run tests
        run: |
          ./scripts/run_tests.sh

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Show binary
        run: |
          ls -lh build/zedis
          file build/zedis

      - name: Build Docker image
        run: |
          docker build \
            --tag "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Validate Compose and monitoring configuration
        run: |
          docker compose config --quiet
          docker compose run --rm --entrypoint promtool prometheus \
            check config /etc/prometheus/prometheus.yml
          jq -e \
            '.uid == "zedis-overview" and (.panels | length) >= 3 and any(.panels[]; any(.targets[]; .expr == "zedis_up"))' \
            monitoring/grafana/dashboards/zedis.json
          test -f monitoring/grafana/provisioning/datasources/prometheus.yml
          test -f monitoring/grafana/provisioning/dashboards/dashboards.yml

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s

      - name: Configure Docker
        if: github.event_name == 'push'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
      - name: Generate ephemeral SSH key
        if: github.event_name == 'push'
        run: |
          ssh-keygen \
            -t rsa \
            -b 3072 \
            -N "" \
            -f /tmp/zedis-deploy-key

      - name: Add ephemeral key to CI service account OS Login
        if: github.event_name == 'push'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          PUBLIC_KEY="$(cat /tmp/zedis-deploy-key.pub)"
          EXPIRATION="$(($(date +%s) + 600))000000"

          jq -n \
            --arg key "$PUBLIC_KEY" \
            --arg expiration "$EXPIRATION" \
            '{
              key: $key,
              expirationTimeUsec: $expiration
            }' \
            > /tmp/oslogin-request.json

          RESPONSE="$(
            curl --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Content-Type: application/json" \
              "https://oslogin.googleapis.com/v1/users/${CI_SERVICE_ACCOUNT}:importSshPublicKey?projectId=${PROJECT_ID}" \
              --data @/tmp/oslogin-request.json
          )"

          echo "$RESPONSE" | jq .

          OSLOGIN_USERNAME="$(
            echo "$RESPONSE" |
              jq -r '.loginProfile.posixAccounts[0].username // empty'
          )"

          test -n "$OSLOGIN_USERNAME"

          echo "OSLOGIN_USERNAME=$OSLOGIN_USERNAME" >> "$GITHUB_ENV"

      - name: Deploy
        if: github.event_name == 'push'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          chmod 600 /tmp/zedis-deploy-key

          SSH_OPTIONS=(
            -i /tmp/zedis-deploy-key
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ProxyCommand="gcloud compute start-iap-tunnel ${VM_NAME} 22 --listen-on-stdin --project=${PROJECT_ID} --zone=${VM_ZONE}"
          )

          tar -czf - docker-compose.yml monitoring |
            ssh "${SSH_OPTIONS[@]}" \
              "${OSLOGIN_USERNAME}@${VM_NAME}" \
              "sudo tar -xzf - -C /opt/zedis"

          ssh "${SSH_OPTIONS[@]}" \
            "${OSLOGIN_USERNAME}@${VM_NAME}" \
            "sudo /usr/local/bin/deploy-zedis ${IMAGE}"
