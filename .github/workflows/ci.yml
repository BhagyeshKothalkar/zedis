name: Zedis CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: zedisv1
  REGION: asia-south1
  REPOSITORY: zedis
  IMAGE_NAME: zedis
  VM_NAME: zedis-vm
  VM_ZONE: asia-south1-b
  CI_SERVICE_ACCOUNT: zedis-ci@zedisv1.iam.gserviceaccount.com
  WIF_PROVIDER: projects/373840764878/locations/global/workloadIdentityPools/github/providers/github

jobs:
  build:
    name: Build, publish and deploy Zedis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Show binary
        run: |
          ls -lh build/zedis
          file build/zedis

      - name: Build Docker image
        run: |
          docker build \
            --tag "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Configure Docker
        if: github.event_name == 'push'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Generate ephemeral SSH key
        if: github.event_name == 'push'
        run: |
          ssh-keygen -t rsa -b 3072 -N "" -f /tmp/zedis-deploy-key

      - name: Add SSH key to OS Login
        if: github.event_name == 'push'
        run: |
          gcloud compute os-login ssh-keys add \
            --key-file=/tmp/zedis-deploy-key.pub \
            --ttl=10m

      - name: Deploy
        if: github.event_name == 'push'
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: ${{ env.VM_NAME }}
          zone: ${{ env.VM_ZONE }}
          project_id: ${{ env.PROJECT_ID }}
          ssh_private_key: /tmp/zedis-deploy-key
          command: |
            sudo /usr/local/bin/deploy-zedis \
              ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
