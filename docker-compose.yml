services:
  zedis:
    build:
      context: .
      dockerfile: dockerfile
    image: ${ZEDIS_IMAGE:-zedis:local}
    command:
      - --port
      - "16379"
      - --no-busy-poll
      - --aol-path
      - /var/lib/zedis/append.log
      - --metrics-dir
      - /var/lib/node_exporter/textfile_collector
      - --metrics-interval
      - "1000"
    ports:
      - "16379:16379"
    volumes:
      - zedis_data:/var/lib/zedis
      - ./monitoring/textfile:/var/lib/node_exporter/textfile_collector
    networks:
      - zedis_monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - ./monitoring/textfile:/var/lib/node_exporter/textfile_collector:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - zedis_monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
    networks:
      - zedis_monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - zedis_monitoring
    restart: unless-stopped

networks:
  zedis_monitoring:
    driver: bridge

volumes:
  zedis_data:
  prometheus_data:
  grafana_data:
